{% extends "base.html" %}
{% block title %}New Post — Feedback Board{% endblock %}
{% block content %}
  <h1>New Post</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>Title {{ form.title }}</label>
    <label>Details {{ form.body }}</label>
    <button class="btn">Create</button>
  </form>
{% endblock %}
