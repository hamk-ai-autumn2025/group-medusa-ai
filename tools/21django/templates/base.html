{% load static humanize %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Feedback Board{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <header class="site-header">
    <nav class="container">
      <a href="{% url 'post_list' %}" class="logo">Feedback Board</a>
      <div class="spacer"></div>
      <form action="{% url 'post_list' %}" method="get" class="search">
        <input name="q" placeholder="Search posts…" value="{{ request.GET.q }}">
      </form>
      {% if user.is_authenticated %}
        <span class="hello">Hello, {{ user.username }}!</span>
        <a href="{% url 'post_create' %}" class="btn">New Post</a>
        <a href="{% url 'logout' %}" class="link">Logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="link">Login</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% for message in messages %}
      <div class="flash {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <footer class="container footer">
    <small>Demo app. <a href="/admin/">Admin</a></small>
  </footer>
</body>
</html>
